[package]
name = "hasher"
version = "1.0.0"
edition = "2021"
license = "MIT"

#[profile.release]
#strip="symbols"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libhasher = { path = "../libhasher" }
anyhow = "1.0.104"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
clap-stdin = { git = "https://git.zevaryx.com/zevaryx/clap-stdin", features = ["clap"] }
ignore = "0.4.25"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
